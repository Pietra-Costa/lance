services:
  postgres:
    image: postgres:16-alpine
    container_name: lance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lance
      POSTGRES_USER: lance
      POSTGRES_PASSWORD: lance_dev
    ports:
      - "5432:5432"
    volumes:
      - lance_postgres_data:/var/lib/postgresql/data

volumes:
  lance_postgres_data: