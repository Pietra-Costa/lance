<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/green.png" />
  <link rel="apple-touch-icon" href="/assets/green.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Plataforma digital brasileira de leilões de arte, colecionáveis e edições musicais." />
  <meta property="og:title" content="Lance — Casa de Leilões" />
  <meta property="og:description" content="Descubra peças singulares e participe de leilões com transparência." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>Lance — Casa de Leilões</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem("lance:theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var isDark = stored === "dark" || (stored !== "light" && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark
          ? "dark"
          : "light";
      } catch (error) {
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
